<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="main-header">

        <div class="logo">
            <h1>Product Store</h1>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search products...">
        </div>

        <div class="header-actions">
            <button id="add-product-btn">+ Add Product</button>

            <div class="action-menu">

                <button id="actions-btn">Actions ▾</button>

                <div class="action-dropdown" id="action-dropdown">

                    <button id="update-btn">
                        Update Product
                    </button>

                    <button id="patch-product-btn">
                        Patch Product
                    </button>

                    <button id="delete-product-btn">
                        Delete Product
                    </button>

                </div>

            </div>
        </div>

    </header>
    <!-- post -->
    <div class="product-form" id="add-product-form">

        <h2>Add New Product</h2>

        <input type="text" id="add-product-name" placeholder="Product name">

        <input type="text" id="add-product-category" placeholder="Category">

        <input type="number" id="add-product-price" placeholder="Price">
        <input type="file" id="add-product-image" accept="image/*">
        <button id="post-product-btn">Add Product</button>

    </div>
    <!-- put -->
    <div class="product-form" id="update-product-form">

        <h2>Update Product</h2>
        <input type="text" id="update-product-id" placeholder="Product ID">
        <input type="text" id="update-product-name" placeholder="Product name">

        <input type="text" id="update-product-category" placeholder="Category">

        <input type="number" id="update-product-price" placeholder="Price">
        <input type="file" id="update-product-image" accept="image/*">
        <button id="put-product-btn">Update Product</button>

    </div>
    <!-- PATCH -->
    <div class="product-form" id="patch-product-form">

        <h2>Patch Product</h2>

        <input type="number" id="patch-product-id" placeholder="Product ID">

        <select id="patch-product-field">
            <option value="name">Name</option>
            <option value="category">Category</option>
            <option value="price">Price</option>
        </select>

        <input type="text" id="patch-product-value" placeholder="New value">

        <button id="patch-btn">Patch Product</button>

    </div>
    <!-- delete -->
    <!-- DELETE -->
    <div class="product-form" id="delete-product-form">

        <h2>Delete Product</h2>

        <input type="number" id="delete-product-id" placeholder="Product ID">

        <button id="delete-btn">Delete Product</button>

    </div>
    <main id="products-container">
        <!-- Products will come here using JavaScript -->
    </main>

    <script src="script.js"></script>

</body>

</html>
